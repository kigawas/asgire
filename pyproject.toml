[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3.2"]

[project]
authors = [
  {name = "Weiliang Li", email = "to.be.impressive@gmail.com"},
  {name = "Django Software Foundation", email = "foundation@djangoproject.com"},
]
dependencies = [
  "typing_extensions>=4; python_version < '3.11'",
]
description = "A revamped and modernized drop-in replacement for asgiref."
license = "BSD-3-Clause"
name = "asgire"
readme = "README.md"
requires-python = ">=3.10"
version = "3.12.0"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[tool.flit.module]
name = "asgiref"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["asgiref"]
