[project]
authors = [
  {name = "Weiliang Li", email = "to.be.impressive@gmail.com"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "typing_extensions>=4; python_version < '3.11'",
]
description = "The revamped and modernized drop-in replacement for asgiref"
license = "BSD-3-Clause"
name = "asgire"
readme = "README.md"
requires-python = ">=3.10"
version = "3.12.1"

[project.urls]
Changelog = "https://github.com/kigawas/asgire/blob/main/CHANGELOG.md"
Homepage = "https://github.com/kigawas/asgire"
Issues = "https://github.com/kigawas/asgire/issues"
Repository = "https://github.com/kigawas/asgire"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3.2"]

[tool.flit.module]
name = "asgiref"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ty.src]
exclude = ["tests/"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
